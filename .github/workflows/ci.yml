name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make verify-harness
      - run: make fmt-check
      - run: make tidy-check
      - run: make vet
      - run: make test
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - run: make modernize

  # The native window needs cgo and the macOS frameworks, which the Linux job
  # cannot compile; this job keeps the application building where it ships.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./internal/adapter/desktop/ ./tools/...
      # Packaging must keep working; signing needs credentials a pull request
      # does not have, so the job stops at the unsigned bundle.
      - run: make app VERSION=ci
      - name: check the bundle
        run: |
          set -euo pipefail
          plutil -lint build/PRadar.app/Contents/Info.plist
          test -x build/PRadar.app/Contents/MacOS/pradar
          test -f build/PRadar.app/Contents/Resources/PRadar.icns
          test "$(build/PRadar.app/Contents/MacOS/pradar version)" = "pradar ci"
